# ============================================================
# Framework Configuration
# ============================================================

# Environment: qa, dev, staging, prod
env=qa

# Browser: chrome, firefox, edge
browser=chrome
headless=true

# Selenium Grid Settings (Optional)
grid.enabled=false
grid.url=http://localhost:4444/wd/hub

# Application URLs
app.url=https://www.saucedemo.com
carwale.url=https://www.carwale.com
api.base.url=https://jsonplaceholder.typicode.com

# Timeouts in seconds
timeout.explicit=15
timeout.pageload=30
timeout.implicit=10

# Test Execution & Retries
max.retry.count=1

# Database Configuration (In-Memory H2 for demo / switch to MySQL/Oracle/Postgres)
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
