<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Automation Execution - Summary Report</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 32px; }
    h1 { margin-top: 0; color: #0f172a; font-size: 26px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 24px 0; }
    .card { padding: 20px; border-radius: 8px; text-align: center; color: white; }
    .card-total { background: #3b82f6; }
    .card-pass { background: #10b981; }
    .card-fail { background: #ef4444; }
    .card-skip { background: #f59e0b; }
    .card-rate { background: #8b5cf6; }
    .card h3 { margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.9; }
    .card .value { font-size: 32px; font-weight: bold; margin: 0; }
    .meta-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    .meta-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .meta-table td:first-child { font-weight: 600; width: 30%; color: #64748b; }
    .actions { margin-top: 32px; display: flex; gap: 16px; }
    .btn { display: inline-block; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
  </style>
</head>
<body>
<div class="container">
  <h1>QA Test Automation - Executive Summary</h1>
  <div class="cards">
    <div class="card card-total"><h3>Total Tests</h3><div class="value">5</div></div>
    <div class="card card-pass"><h3>Passed</h3><div class="value">5</div></div>
    <div class="card card-fail"><h3>Failed</h3><div class="value">0</div></div>
    <div class="card card-skip"><h3>Skipped</h3><div class="value">0</div></div>
    <div class="card card-rate"><h3>Pass Rate</h3><div class="value">100.0%</div></div>
  </div>
  <table class="meta-table">
    <tr><td>Generated At</td><td>2026-11-01 09:37:48</td></tr>
    <tr><td>Total Execution Time</td><td>18.871 seconds</td></tr>
    <tr><td>Operating System</td><td>Windows 11</td></tr>
    <tr><td>Java Version</td><td>21.0.7</td></tr>
  </table>
  <div class="actions">
    <a class="btn btn-primary" href="detailed_report.html">View Detailed Tabular Report &rarr;</a>
    <a class="btn btn-secondary" href="extent-report.html">Open Extent Spark Report</a>
  </div>
</div>
</body>
</html>
